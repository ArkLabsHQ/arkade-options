server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    absolute_redirect off;

    location = /app {
        return 302 /;
    }

    location = /app/ {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
