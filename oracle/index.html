<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
<main>
  <h1>Oracle</h1>
  <section id="status"></section>
  <section>
    <p class="muted">One key signs prices. It stays on the server. The admin token is sent only as a bearer.</p>
    <label>Admin token <input id="token" type="password" autocomplete="off"></label>
    <button id="issue" type="button">Issue</button>
    <button id="recover" type="button">Recover pending</button>
    <button id="deploy" type="button">Deploy</button>
    <p id="admin-error" class="err"></p>
  </section>
  <section>
    <p class="muted">The oracle also samples BTCUSD on its own. This records one price at the current time.</p>
    <form id="sample">
      <label>Price, USD cents <input id="price" inputmode="numeric"></label>
      <button type="submit">Record price</button>
    </form>
    <p id="sample-error" class="err"></p>
  </section>
</main>
<script type="module" src="/page.js"></script>
</body>
</html>
