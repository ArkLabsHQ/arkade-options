name: Contracts

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: contracts/vm/go.mod
          cache-dependency-path: contracts/vm/go.sum

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm test:vm
